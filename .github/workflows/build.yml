name: Build & Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and run unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild build \
            -project NetICU.xcodeproj \
            -scheme NetICU \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Test
        run: |
          xcodebuild test \
            -project NetICU.xcodeproj \
            -scheme NetICU \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""
